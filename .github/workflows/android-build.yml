name: Android APK
on:
  push:
    branches: [ recovery/flutter-rebuild ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host
        run: |
          rm -rf /tmp/flutter_host
          mkdir -p /tmp/flutter_host
          cd /tmp/flutter_host
          flutter create --platforms=android --org kr.dondonhae --project-name dondonhae .
          rm -rf "$GITHUB_WORKSPACE/android"
          cp -R android "$GITHUB_WORKSPACE/android"
      - name: Verify project
        run: |
          cd "$GITHUB_WORKSPACE"
          pwd
          test -f pubspec.yaml
          test -f lib/main.dart
      - name: Dependencies
        run: cd "$GITHUB_WORKSPACE" && flutter pub get
      - name: Analyze
        run: cd "$GITHUB_WORKSPACE" && flutter analyze --no-fatal-warnings
      - name: Build APK
        run: cd "$GITHUB_WORKSPACE" && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: DonDonHae-v1.7.0-debug-apk
          path: ${{ github.workspace }}/build/app/outputs/flutter-apk/app-debug.apk
