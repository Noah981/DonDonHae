name: Android APK
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ recovery/flutter-rebuild ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host
        run: flutter create --platforms=android --org kr.dondonhae --project-name dondonhae .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: DonDonHae-v1.7.0-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
