name: Android APK
on:
  push:
    branches: [ recovery/flutter-rebuild ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Restore required map and image assets
        run: |
          mkdir -p assets/data assets/images
          curl -L --fail --retry 3 -o assets/data/korea_provinces.geojson https://raw.githubusercontent.com/southkorea/southkorea-maps/master/kostat/2018/json/skorea-provinces-2018-geo.json
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVQIHWP4z8DwHwAFgAI/ScL8WQAAAABJRU5ErkJggg==' | base64 -d > assets/images/dondonhae_symbol.png
          cp assets/images/dondonhae_symbol.png assets/images/pig_hero.jpg
      - name: Generate Android host
        run: |
          rm -rf /tmp/host
          mkdir -p /tmp/host
          cd /tmp/host
          flutter create --platforms=android --org kr.dondonhae --project-name dondonhae .
          cp -R android "$GITHUB_WORKSPACE/android"
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: DonDonHae-WORK3-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
