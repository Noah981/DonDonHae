name: Android APK
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ recovery/flutter-rebuild ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host
        run: |
          mkdir -p /tmp/flutter_host
          cd /tmp/flutter_host
          flutter create --platforms=android --org kr.dondonhae --project-name dondonhae .
          cp -R android "$GITHUB_WORKSPACE/android"
      - name: Dependencies
        working-directory: ${{ github.workspace }}
        run: flutter pub get
      - name: Analyze
        working-directory: ${{ github.workspace }}
        run: flutter analyze --no-fatal-warnings
      - name: Build APK
        working-directory: ${{ github.workspace }}
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: DonDonHae-v1.7.0-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
