name: Android APK
on:
  push:
    branches: [ recovery/flutter-rebuild ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: |
          rm -rf /tmp/host
          mkdir -p /tmp/host
          cd /tmp/host
          flutter create --platforms=android --org kr.dondonhae --project-name dondonhae .
          cp -R android "$GITHUB_WORKSPACE/android"
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: DonDonHae-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
